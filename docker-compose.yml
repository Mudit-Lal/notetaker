services:
  notetaker:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - notetaker-data:/app/data
    restart: unless-stopped

  # MCP server over SSE — always running, accessible via HTTP
  mcp:
    build: .
    env_file: .env
    environment:
      - MCP_TRANSPORT=sse
      - MCP_PORT=8080
    ports:
      - "8080:8080"
    volumes:
      - notetaker-data:/app/data
    command: ["python", "-m", "src.main", "mcp"]
    restart: unless-stopped

volumes:
  notetaker-data:
