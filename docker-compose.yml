services:
  notetaker:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - notetaker-data:/app/data
    restart: unless-stopped

  # Run MCP server separately if needed
  mcp:
    build: .
    env_file: .env
    volumes:
      - notetaker-data:/app/data
    command: ["python", "-m", "src.main", "mcp"]
    profiles:
      - mcp

volumes:
  notetaker-data:
