# Nginx reverse proxy config for Notetaker API
# Copy to /etc/nginx/sites-available/notetaker on your VPS
# Then: ln -s /etc/nginx/sites-available/notetaker /etc/nginx/sites-enabled/
# Then: certbot --nginx -d notes.muditlal.com

server {
    listen 80;
    server_name notes.muditlal.com;

    # Redirect HTTP to HTTPS (certbot will add this automatically)
    # location / { return 301 https://$host$request_uri; }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed in future)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Larger body for potential voice note uploads via API
    client_max_body_size 25M;
}
